<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Title</title>

    <style>
        .continer
        {
            display: grid;
            grid-template-columns: auto auto auto;
            width: fit-content;
        }

        .continer div
        {
            display: inline;
        }
    </style>
</head>
<body>
    <div class="continer">
        <div class="item"> <!--gride 1-->
            (<div id="Athletics-num"></div>)<br>
            (<div id="Acrobatics-num"></div>)<br>
            (<div id="Sleight of Hand-num"></div>)<br>
            (<div id="Stealth-num"></div>)<br>

            (<div id="Perception-num"></div>)<br>
            (<div id="Survival-num"></div>)<br>
            (<div id="Deception-num"></div>)<br>
            (<div id="Intimidation-num"></div>)<br>
            (<div id="Performance-num"></div>)<br>
            (<div id="Persuasion-num"></div>)

            <label for="Investigation">Investigation:</label><br>

            <label for="Deception">Deception:</label><br>
            <label for="Intimidation">Intimidation:</label><br>
            <label for="Performance">Performance:</label><br>
            <label for="Persuasion">Persuasion:</label>
        </div>
        <div class="item"> <!--gride 3-->
