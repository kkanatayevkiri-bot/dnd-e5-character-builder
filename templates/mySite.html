<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Title</title>
    <style>
        .continer
        {
            display: grid;
            grid-template-columns: auto auto auto;
            width: fit-content;
        }

        .continer div
        {
            display: inline;
        }
    </style>
</head>
<body>
    <!-- header -->
    <label for="class">Class:</label>
    <input list="classes" id="class" placeholder="Paladin" onchange="changeClass(this.value)">
    <datalist id="classes">
        <option>paladin</option>
        <option>fighter</option>
    </datalist>

    <label for="race">Race:</label>
    <input list="races" id="race" placeholder="human">
    <datalist id="races">
        <option>human</option>
        <option>drow</option>
    </datalist>

    <label for="alignment">Alignment:</label>
    <input list="alignments" id="alignment" placeholder="Lawful good">
    <datalist id="alignments">
        <option>Lawful good</option>
        <option>Neutral good</option>
        <option>Chaotic good</option>
        <option>Lawful neutral</option>
        <option>Neutral</option>
        <option>Chaotic neutral</option>
        <option>Lawful evil</option>
        <option>Chaotic evil</option>
    </datalist>
    <br>
    <div id="hitPoinst-cont"></div>
    <br>
    <!-- stats -->
    <h3>Stats:</h3>
    <b>Points:</b> <div style="display: inline;" id="points-cont"></div>
    <br><br>
    <div id="stat-cont"></div>
    <button onclick="currClass.rollingDice()">Roll die Method</button>
    <button onclick="currClass.resetPoinst()">Reset points</button>
    <br>
    <h3>Modifiers:</h3>
    <div id="modifiers-cont"></div>
    <br>
    <h3>Saving Throws:</h3>
    <div id="saving-throws-cont"></div>
    <br>
    <h3>Features:</h3>
    <div id="Features-cont"></div>
    <br>
    <!-- left side of grail -->
    <!-- SKILLS -->
    <h3>Skills:</h3>
        Avaliable proficiency points: <div style="display: inline;" id="Ppoints"></div><br>
        Avaliable expertise points: <div style="display: inline;" id="Epoints"></div>
    <br>
    <br>
         <div class="continer">
        <div class="item"> <!--gride 1-->
            (<div id="Athletics-num"></div>)<br>
            (<div id="Acrobatics-num"></div>)<br>
            (<div id="Sleight of Hand-num"></div>)<br>
            (<div id="Stealth-num"></div>)<br>
            (<div id="Arcana-num"></div>)<br>
            (<div id="History-num"></div>)<br>
            (<div id="Investigation-num"></div>)<br>
            (<div id="Nature-num"></div>)<br>
            (<div id="Religion-num"></div>)<br>
            (<div id="Animal Handling-num"></div>)<br>
            (<div id="Insight-num"></div>)<br>
            (<div id="Medicine-num"></div>)<br>
            (<div id="Perception-num"></div>)<br>
            (<div id="Survival-num"></div>)<br>
            (<div id="Deception-num"></div>)<br>
            (<div id="Intimidation-num"></div>)<br>
            (<div id="Performance-num"></div>)<br>
            (<div id="Persuasion-num"></div>)
        </div>
        <div class="item"> <!--gride 2-->
            <label for="Athletics">Athletics:</label><br>
            <label for="Acrobatics">Acrobatics:</label><br>
            <label for="Sleight of Hand">Sleight of Hand:</label><br>
            <label for="Stealth">Stealth:</label><br>
            <label for="Arcana">Arcana:</label><br>
            <label for="History">History:</label><br>
            <label for="Investigation">Investigation:</label><br>
            <label for="Nature">Nature:</label><br>
            <label for="Religion">Religion:</label><br>
            <label for="Animal Handling">Animal Handling:</label><br>
            <label for="Insight">Insight:</label><br>
            <label for="Medicine">Medicine:</label><br>
            <label for="Perception">Perception:</label><br>
            <label for="Survival">Survival:</label><br>
            <label for="Deception">Deception:</label><br>
            <label for="Intimidation">Intimidation:</label><br>
            <label for="Performance">Performance:</label><br>
            <label for="Persuasion">Persuasion:</label>
        </div>
        <div class="item"> <!--gride 3-->
            <input type="checkbox" name="proficiency" id="Athletics" value="Athletics" onchange="currClass.proficiencyCap(this.value)">
            <input type="checkbox" name="expertise" id="exp-Athletics" value="Athletics" onchange="currClass.expertiseCap(this.value)"><br>
            <input type="checkbox" name="proficiency" id="Acrobatics" value="Acrobatics" onchange="currClass.proficiencyCap(this.value)">
            <input type="checkbox" name="expertise" id="exp-Acrobatics" value="Acrobatics" onchange="currClass.expertiseCap(this.value)"><br>
            <input type="checkbox" name="proficiency" id="Sleight of Hand" value="Sleight of Hand" onchange="currClass.proficiencyCap(this.value)">
            <input type="checkbox" name="expertise" id="exp-Sleight of Hand" value="Sleight of Hand" onchange="currClass.expertiseCap(this.value)"><br>
            <input type="checkbox" name="proficiency" id="Stealth" value="Stealth" onchange="currClass.proficiencyCap(this.value)">
            <input type="checkbox" name="expertise" id="exp-Stealth" value="Stealth" onchange="currClass.expertiseCap(this.value)"><br>
            <input type="checkbox" name="proficiency" id="Arcana" value="Arcana" onchange="currClass.proficiencyCap(this.value)">
            <input type="checkbox" name="expertise" id="exp-Arcana" value="Arcana" onchange="currClass.expertiseCap(this.value)"><br>
            <input type="checkbox" name="proficiency" id="History" value="History" onchange="currClass.proficiencyCap(this.value)">
            <input type="checkbox" name="expertise" id="exp-History" value="History" onchange="currClass.expertiseCap(this.value)"><br>
            <input type="checkbox" name="proficiency" id="Investigation" value="Investigation" onchange="currClass.proficiencyCap(this.value)">
            <input type="checkbox" name="expertise" id="exp-Investigation" value="Investigation" onchange="currClass.expertiseCap(this.value)"><br>
            <input type="checkbox" name="proficiency" id="Nature" value="Nature" onchange="currClass.proficiencyCap(this.value)">
            <input type="checkbox" name="expertise" id="exp-Nature" value="Nature" onchange="currClass.expertiseCap(this.value)"><br>
            <input type="checkbox" name="proficiency" id="Religion" value="Religion" onchange="currClass.proficiencyCap(this.value)">
            <input type="checkbox" name="expertise" id="exp-Religion" value="Religion" onchange="currClass.expertiseCap(this.value)"><br>
            <input type="checkbox" name="proficiency" id="Animal Handling" value="Animal Handling" onchange="currClass.proficiencyCap(this.value)">
            <input type="checkbox" name="expertise" id="exp-Animal Handling" value="Animal Handling" onchange="currClass.expertiseCap(this.value)"><br>
            <input type="checkbox" name="proficiency" id="Insight" value="Insight" onchange="currClass.proficiencyCap(this.value)">
            <input type="checkbox" name="expertise" id="exp-Insight" value="Insight" onchange="currClass.expertiseCap(this.value)"><br>
            <input type="checkbox" name="proficiency" id="Medicine" value="Medicine" onchange="currClass.proficiencyCap(this.value)">
            <input type="checkbox" name="expertise" id="exp-Medicine" value="Medicine" onchange="currClass.expertiseCap(this.value)"><br>
            <input type="checkbox" name="proficiency" id="Perception" value="Perception" onchange="currClass.proficiencyCap(this.value)">
            <input type="checkbox" name="expertise" id="exp-Perception" value="Perception" onchange="currClass.expertiseCap(this.value)"><br>
            <input type="checkbox" name="proficiency" id="Survival" value="Survival" onchange="currClass.proficiencyCap(this.value)">
            <input type="checkbox" name="expertise" id="exp-Survival" value="Survival" onchange="currClass.expertiseCap(this.value)"><br>
            <input type="checkbox" name="proficiency" id="Deception" value="Deception" onchange="currClass.proficiencyCap(this.value)">
            <input type="checkbox" name="expertise" id="exp-Deception" value="Deception" onchange="currClass.expertiseCap(this.value)"><br>
            <input type="checkbox" name="proficiency" id="Intimidation" value="Intimidation" onchange="currClass.proficiencyCap(this.value)">
            <input type="checkbox" name="expertise" id="exp-Intimidation" value="Intimidation" onchange="currClass.expertiseCap(this.value)"><br>
            <input type="checkbox" name="proficiency" id="Performance" value="Performance" onchange="currClass.proficiencyCap(this.value)">
            <input type="checkbox" name="expertise" id="exp-Performance" value="Performance" onchange="currClass.expertiseCap(this.value)"><br>
            <input type="checkbox" name="proficiency" id="Persuasion" value="Persuasion" onchange="currClass.proficiencyCap(this.value)">
            <input type="checkbox" name="expertise" id="exp-Persuasion" value="Persuasion" onchange="currClass.expertiseCap(this.value)">
        </div>
    </div>
    <script src="static/classes.js"></script>
</body>
</html>
